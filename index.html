<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Al Fazaa — Road Side Assistance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--dark:#232A2E;--green-1:#A6C000;--green-2:#8AA800;--green-3:#6F8C00;--cream:#F6F0E2;}
  html,body{min-height:100%;}
  body{
    font-family:'Montserrat',sans-serif;color:var(--dark);
    min-height:100dvh;
    background:linear-gradient(160deg,var(--green-1) 0%,var(--green-2) 50%,var(--green-3) 100%);
    display:flex;align-items:center;justify-content:center;padding:22px 14px;position:relative;overflow-x:hidden;
  }
  body::before{content:'';position:fixed;inset:0;background:url("brand_horse.png") repeat;background-size:120px;opacity:.05;pointer-events:none;}

  .card{
    position:relative;z-index:2;width:100%;max-width:440px;
    background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.35);border-radius:26px;box-shadow:0 24px 60px rgba(20,30,0,.30);
    padding:28px 22px 30px;text-align:center;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .view[hidden]{display:none;}

  /* ---------- WELCOME ---------- */
  .logo{height:104px;width:auto;margin:2px auto 8px;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));}
  .greeting{font-size:29px;font-weight:800;line-height:1.15;}
  .dear{font-size:16px;font-weight:600;margin-top:4px;opacity:.9;}
  .welcome{font-size:12.5px;font-weight:500;margin-top:12px;opacity:.85;line-height:1.5;}
  .badge247{display:inline-flex;align-items:center;gap:11px;margin-top:15px;background:var(--dark);color:#fff;
    border-radius:30px;padding:9px 17px 9px 13px;box-shadow:0 8px 18px rgba(20,30,0,.28);}
  .badge247 .num{display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:900;color:#B9D400;letter-spacing:.4px;}
  .badge247 .num svg{width:18px;height:18px;stroke:#B9D400;fill:none;}
  .badge247 .bsep{width:1px;height:20px;background:rgba(255,255,255,.30);}
  .badge247 .sub{font-size:11px;font-weight:600;opacity:.92;line-height:1.2;text-align:start;}
  body.ar .badge247 .sub{font-family:'Noto Kufi Arabic',sans-serif;}
  body.hi .badge247 .sub{font-family:'Noto Sans Devanagari',sans-serif;}
  .clock{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:11px;font-weight:600;
    background:rgba(35,42,46,.14);border:1px solid rgba(35,42,46,.18);padding:7px 13px;border-radius:30px;}
  .clock .dot{width:7px;height:7px;border-radius:50%;background:#2faa3f;box-shadow:0 0 0 3px rgba(47,170,63,.25);}
  .rule{height:1px;background:rgba(35,42,46,.25);margin:20px 4px 16px;}
  .choose{font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.82;margin-bottom:14px;line-height:1.5;padding:0 6px;}
  .langs{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .lang{display:flex;align-items:center;gap:11px;justify-content:flex-start;background:var(--cream);
    border:1px solid rgba(35,42,46,.10);border-radius:15px;padding:13px 14px;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 14px rgba(20,30,0,.16);transition:transform .15s,box-shadow .15s;}
  .lang:active{transform:scale(.97);}
  .lang:hover{box-shadow:0 10px 20px rgba(20,30,0,.22);}
  .lang .flag{font-size:22px;line-height:1;}
  .lang .nm{font-size:14px;font-weight:700;}
  .lang.full{grid-column:1/-1;justify-content:center;}

  /* ---------- MENU ---------- */
  .mhead{display:flex;align-items:center;gap:13px;text-align:start;}
  .mhead img{height:56px;width:auto;flex-shrink:0;}
  .mhead .htxt{flex:1;min-width:0;}
  .mhead .hg{font-size:16px;font-weight:800;line-height:1.15;}
  .mhead .hs{font-size:11px;font-weight:500;opacity:.8;margin-top:2px;}
  .mrule{height:1px;background:rgba(35,42,46,.25);margin:16px 2px;}
  .mtitle{font-size:21px;font-weight:800;text-align:start;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
  .mtitle::before{content:'';width:5px;height:22px;border-radius:3px;background:var(--dark);display:inline-block;}

  .list{display:flex;flex-direction:column;gap:11px;}
  .svc{display:flex;align-items:center;gap:13px;background:var(--cream);border:1px solid rgba(35,42,46,.09);
    border-radius:16px;padding:13px 15px;box-shadow:0 7px 16px rgba(20,30,0,.15);
    animation:rise .4s ease both;}
  .svc .ic{width:46px;height:46px;border-radius:13px;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .svc .ic svg{width:25px;height:25px;stroke:#B9D400;fill:none;}
  .svc .info{flex:1;min-width:0;text-align:start;}
  .svc .nm{font-size:14.5px;font-weight:700;line-height:1.2;}
  .svc .ds{font-size:11px;color:#5b6266;margin-top:3px;line-height:1.35;}
  .svc .pr{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
  .svc .from{font-size:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.55;}
  .svc .amt{font-size:16px;font-weight:800;white-space:nowrap;}
  .svc .amt b{font-size:11px;font-weight:700;opacity:.75;}

  .pay{margin-top:18px;text-align:start;}
  .pay-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.72;margin-bottom:9px;}
  .pays{display:flex;flex-wrap:wrap;gap:8px;}
  .pchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(35,42,46,.10);
    border-radius:10px;padding:7px 11px;font-size:12px;font-weight:800;color:var(--dark);box-shadow:0 4px 10px rgba(20,30,0,.12);}
  .pchip.visa{color:#1A1F71;font-style:italic;letter-spacing:.5px;font-size:14px;}
  .pchip svg{display:block;}
  .mc{position:relative;width:25px;height:16px;display:inline-block;}
  .mc i{position:absolute;top:0;width:16px;height:16px;border-radius:50%;}
  .mc i:first-child{left:0;background:#EB001B;}
  .mc i:last-child{right:0;background:#F79E1B;mix-blend-mode:multiply;}
  .gP{color:#4285F4;font-size:14px;font-weight:900;}
  .invoice{display:flex;gap:8px;align-items:flex-start;margin-top:11px;font-size:11px;font-weight:600;color:#33402f;line-height:1.45;text-align:start;}
  .invoice svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;stroke:var(--dark);fill:none;}
  body.ar .invoice,body.hi .invoice{font-family:inherit;}
  body.ar .invoice{font-family:'Noto Kufi Arabic',sans-serif;}
  body.hi .invoice{font-family:'Noto Sans Devanagari',sans-serif;}

  .note{display:flex;gap:8px;align-items:flex-start;text-align:start;margin-top:16px;
    font-size:11px;font-weight:500;line-height:1.5;color:#33402f;
    background:rgba(35,42,46,.10);border:1px solid rgba(35,42,46,.14);border-radius:12px;padding:11px 13px;}
  .note svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;stroke:var(--dark);fill:none;}

  .safety{margin-top:14px;background:var(--dark);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:13px;align-items:center;text-align:start;box-shadow:0 8px 20px rgba(20,30,0,.25);}
  .safety svg{width:30px;height:30px;stroke:#B9D400;fill:none;flex-shrink:0;}
  .safety .st{font-size:13px;font-weight:800;line-height:1.35;}
  .safety .ss{font-size:11.5px;font-weight:500;opacity:.85;margin-top:3px;line-height:1.5;}
  body.ar .safety .st,body.ar .safety .ss{font-family:'Noto Kufi Arabic',sans-serif;}
  body.hi .safety .st,body.hi .safety .ss{font-family:'Noto Sans Devanagari',sans-serif;}

  .change{margin-top:16px;display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--dark);
    font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.72;cursor:pointer;}
  .change svg{width:15px;height:15px;stroke:var(--dark);fill:none;}

  /* RTL / scripts */
  body.rtl{direction:rtl;}
  body.ar .greeting,body.ar .dear,body.ar .welcome,body.ar .choose,body.ar .lang .nm,
  body.ar .mhead .hg,body.ar .mhead .hs,body.ar .mtitle,body.ar .svc .nm,body.ar .svc .ds,body.ar .note,body.ar .change{font-family:'Noto Kufi Arabic',sans-serif;}
  body.hi .greeting,body.hi .dear,body.hi .welcome,body.hi .choose,
  body.hi .mhead .hg,body.hi .mhead .hs,body.hi .mtitle,body.hi .svc .nm,body.hi .svc .ds,body.hi .note,body.hi .change{font-family:'Noto Sans Devanagari',sans-serif;}
</style>
</head>

  let current='en';
  const dohaHour=()=>parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Qatar',hour:'2-digit',hour12:false}).format(new Date()),10)%24;
  const bucket=h=>(h>=5&&h<12)?'m':(h>=12&&h<17)?'a':(h>=17&&h<21)?'e':'n';

  function updateClock(){
    const t=T[current];
    const time=new Intl.DateTimeFormat(t.locale,{timeZone:'Asia/Qatar',hour:'2-digit',minute:'2-digit'}).format(new Date());
    const date=new Intl.DateTimeFormat(t.locale,{timeZone:'Asia/Qatar',weekday:'long',day:'numeric',month:'long'}).format(new Date());
    const city={en:'Doha',ar:'الدوحة',hi:'दोहा',fil:'Doha',fr:'Doha'}[current];
    document.getElementById('clock').textContent=`${city} · ${time} · ${date}`;
  }

  function renderWelcome(){
    const t=T['en'];
    document.getElementById('greeting').textContent=t[bucket(dohaHour())];
    document.getElementById('dear').textContent=t.dear;
    document.getElementById('welcomeTxt').textContent=t.welcome;
    document.getElementById('badge247').textContent=t.f247;
    document.getElementById('choose').textContent=t.choose;
    updateClock();
  }

  function buildMenu(lang){
    current=lang; const t=T[lang];
    document.body.className=t.cls;
    document.documentElement.lang=lang;
    document.getElementById('mGreet').textContent=t[bucket(dohaHour())];
    document.getElementById('mSub').textContent=t.dear;
    document.getElementById('mTitle').textContent=t.svc;
    document.getElementById('noteTxt').textContent=t.note;
    document.getElementById('payTitle').textContent=t.pay;
    document.getElementById('cashLbl').textContent=t.cash;
    document.getElementById('invoiceTxt').textContent=t.invoice;
    document.getElementById('safeT').textContent=t.safeT;
    document.getElementById('safeB').textContent=t.safeB;
    document.getElementById('changeTxt').textContent=t.change;
    const html=t.list.map((s,i)=>{
      const price = lang==='ar' ? `${PRICES[i]} <b>${t.cur}</b>` : `<b>${t.cur}</b> ${PRICES[i]}`;
      return `<div class="svc" style="animation-delay:${i*55}ms">
        <div class="ic">${ICONS[i]}</div>
        <div class="info"><div class="nm">${s.nm}</div><div class="ds">${s.ds}</div></div>
        <div class="pr"><div class="from">${t.from}</div><div class="amt">${price}</div></div>
      </div>`;
    }).join('');
    document.getElementById('list').innerHTML=html;
  }

  document.querySelectorAll('.lang').forEach(btn=>{
    btn.addEventListener('click',()=>{
      buildMenu(btn.dataset.lang);
      document.getElementById('welcome').hidden=true;
      document.getElementById('menu').hidden=false;
      window.scrollTo({top:0,behavior:'instant'});
      document.querySelector('.card').scrollIntoView({block:'start'});
    });
  });

  function resetLang(){
    document.body.className='';
    document.documentElement.lang='en';
    current='en';
    document.getElementById('menu').hidden=true;
    document.getElementById('welcome').hidden=false;
    renderWelcome();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  renderWelcome();
  setInterval(()=>{ if(!document.getElementById('welcome').hidden) updateClock(); },15000);
</script>
